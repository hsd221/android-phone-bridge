name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run package:binary
      - name: Smoke test the standalone executable
        shell: bash
        run: node scripts/smoke-binary.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-binary-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/phone-bridge-*
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t phone-bridge:ci .
      - run: node scripts/smoke-container.mjs phone-bridge:ci
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :demo:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-demo-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/demo/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
  android-emulator:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: default
            graphics: -gpu swiftshader_indirect
          - api: 36
            target: google_apis
            graphics: -gpu swiftshader -feature GLDirectMem -feature HasSharedSlotsHostMemoryAllocator
          - api: '36.1'
            target: google_apis
            graphics: -gpu swiftshader -feature GLDirectMem -feature HasSharedSlotsHostMemoryAllocator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for Android emulator userdata
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :demo:assembleDebug
        working-directory: android
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window ${{ matrix.graphics }} -no-snapshot -noaudio -no-boot-anim -memory 2048
          script: |
            npm run test:android -- emulator-5554
            if [ '${{ matrix.api }}' = '35' ]; then npm run test:android:boot -- emulator-5554 && npm run test:android:unlock -- emulator-5554 && npm run test:android:unlock:shizuku -- emulator-5554 && npm run test:android:data -- emulator-5554; fi
